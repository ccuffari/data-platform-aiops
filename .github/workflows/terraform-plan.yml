name: terraform-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read
  pull-requests: write

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  plan:
    name: plan (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, test, prod]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.env }}
    concurrency:
      group: tf-plan-${{ matrix.env }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -input=false -no-color

      - name: terraform validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan
        continue-on-error: true

      - name: terraform show
        if: always()
        run: terraform show -no-color tfplan > plan.txt || true

      - name: upload plan artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfplan-${{ matrix.env }}-${{ github.event.pull_request.number }}
          path: infra/environments/${{ matrix.env }}/tfplan
          if-no-files-found: warn
          retention-days: 5

      - name: comment plan on PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.env }}';
            const planPath = `infra/environments/${env}/plan.txt`;
            let body = 'plan.txt non trovato (init/plan fallito?)';
            try { body = fs.readFileSync(planPath, 'utf8'); } catch (e) {}
            if (body.length > 60000) body = body.slice(0, 60000) + '\n...troncato';
            const marker = `<!-- tf-plan-${env} -->`;
            const fullBody = `${marker}\n### Terraform Plan: \`${env}\`\n\n\`\`\`\n${body}\n\`\`\``;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

