name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  contents: read

# Serializza TUTTI i run di questo workflow: un solo apply alla volta.
# Senza, push ravvicinati causano collisioni sui lock di stato.
concurrency:
  group: terraform-apply-main
  cancel-in-progress: false

env:
  ARM_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
  ARM_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"

jobs:
  apply:
    name: apply (${{ matrix.env }})
    runs-on: ubuntu-latest
    environment: ${{ matrix.env }}
    strategy:
      fail-fast: false
      matrix:
        env: [dev, test, prod]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.env }}
    concurrency:
      group: tf-apply-${{ matrix.env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false -no-color

      - name: terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan

      - name: terraform apply
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
